# Flujo de integración y despliegue continuos (CI/CD).
#
# Integración continua (CI): cada cambio que llega al repositorio se verifica
# automáticamente, sin depender de que alguien recuerde correr las pruebas.
# Despliegue continuo (CD): si la verificación pasa, el cambio se publica.
# En este proyecto el despliegue es simulado: solo imprime un mensaje.
#
# En GitHub Actions este archivo es un "workflow". Contiene "jobs" (trabajos que
# corren en una máquina virtual llamada runner) y cada job contiene "steps" (pasos).

name: CI/CD

# Eventos que disparan el workflow: un push a main o un pull request hacia main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # CI: análisis estático
  # ---------------------------------------------------------------------------
  analisis-estatico:
    name: Análisis estático
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Instalar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Revisa código sobrante, nombres y complejidad sin ejecutar el código.
      - name: Revisar el código con Checkstyle
        run: mvn -B checkstyle:check

  # ---------------------------------------------------------------------------
  # CI: pruebas unitarias
  # ---------------------------------------------------------------------------
  pruebas-unitarias:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      # Descarga el código del repositorio en el runner.
      - name: Descargar el código
        uses: actions/checkout@v6

      # Instala Java 21 (distribución Eclipse Temurin) y guarda en caché el
      # repositorio local de Maven para no descargar las dependencias cada vez.
      - name: Instalar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # -B (batch mode) evita los mensajes interactivos y las barras de progreso.
      # -Dtest selecciona solo las clases de prueba del paquete "unitarias".
      - name: Ejecutar pruebas unitarias
        run: mvn -B test -Dtest='**/unitarias/*Test'

  # ---------------------------------------------------------------------------
  # CI: pruebas BDD
  # ---------------------------------------------------------------------------
  pruebas-bdd:
    name: Pruebas BDD
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Instalar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Ejecuta los escenarios de src/test/resources/features con Cucumber.
      - name: Ejecutar escenarios BDD
        run: mvn -B test -Dtest=RunCucumberTest

  # ---------------------------------------------------------------------------
  # CI: cobertura
  # ---------------------------------------------------------------------------
  cobertura:
    name: Cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Instalar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify corre todas las pruebas y la meta check de JaCoCo (mínimo 90 %).
      - name: Medir y verificar la cobertura
        run: mvn -B verify

  # ---------------------------------------------------------------------------
  # CD: despliegue simulado
  # ---------------------------------------------------------------------------
  despliegue:
    name: Despliegue (simulado)
    # needs: el despliegue solo corre si todos los jobs listados terminaron bien.
    # Si una prueba falla, este job no se ejecuta y nada llega a producción.
    needs: [analisis-estatico, pruebas-unitarias, pruebas-bdd, cobertura]
    # Solo se despliega lo que entra a main, nunca desde un pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar
        run: |
          echo "Versión: ${{ github.sha }}"
          echo "Desplegado"
